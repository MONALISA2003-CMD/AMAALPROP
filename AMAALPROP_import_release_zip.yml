name: AMAALPROP — Import ZIP into repository root

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Existing ZIP in incoming/ (e.g. incoming/AMAALPROP_Phase0_REPAIRED.zip)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: amaalprop-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-zip:
    if: github.repository == 'MONALISA2003-CMD/AMAALPROP'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the real repo root
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Find incoming ZIP
        id: incoming
        env:
          INPUT_ZIP: ${{ inputs.zip_path }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            archive="$INPUT_ZIP"
          else
            # Require exactly one incoming archive for deterministic imports.
            mapfile -t found < <(find incoming -mindepth 1 -maxdepth 1 -type f -name '*.zip' | sort)
            [ "${#found[@]}" -eq 1 ] || { echo 'Exactly one incoming ZIP is required'; exit 1; }
            archive="${found[0]}"
          fi
          [[ "$archive" =~ ^incoming/[A-Za-z0-9._-]+\.zip$ ]] || { echo 'ZIP must be directly inside incoming/'; exit 1; }
          test -f "$archive" || { echo "Archive missing: $archive"; exit 1; }
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Import only safe canonical files (no nested folder, no duplicates)
        env:
          ZIP_PATH: ${{ steps.incoming.outputs.path }}
        run: |
          python3 scripts/import_release_zip.py "$ZIP_PATH"
          rm -- "$ZIP_PATH"
          rmdir incoming 2>/dev/null || true
          node scripts/doctor.mjs
          node scripts/verify-openapi.mjs
          python3 -m unittest discover -s tests/importer -v
      - name: Open an auditable pull request (do not auto-merge imported code)
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.incoming.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="amaalprop/import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add --all
          if git diff --cached --quiet; then
            echo 'Nothing changed; import already applied.'
            exit 0
          fi
          git commit -m "chore(amaalprop): import canonical ZIP contents"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'AMAALPROP: import ZIP into clean repository root' \
            --body "Automated import from \`$ZIP_PATH\`. Review before merging. The ZIP was removed, the outer AMAALPROP folder stripped, repeated reference documents deduplicated, and stale imported files reconciled via the manifest."
